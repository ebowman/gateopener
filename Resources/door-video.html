<!DOCTYPE html>
<html>
<head><title>comelit door camera</title></head>
<body style="margin:0;background:#000">
<video id="v" autoplay playsinline muted style="width:100%;height:100%;background:#222"></video>
<canvas id="c" style="display:none"></canvas>
<script>
// Drives ONE WebRTC session against the Comelit door camera, via WKWebView.
// This is a stripped-down copy of ../comelit/comelit/webrtc_page.html
// (itself the source for the proven scratchpad/webrtc-spike harness): the
// stale-frame watchdog and renegotiation machinery have been DELIBERATELY
// removed. DoorVideoSession (Swift) establishes exactly one session and
// never renegotiates -- see the gateopener-12h epic and bd memories
// gateopener-yjn-spike-result-wkwebview-webkit-s-own /
// gateopener-yjn-spike-addendum-answers-to-a-follow for why this recipe
// (recvonly transceivers, audio before video, non-trickle ICE, pre-resolved
// STUN IPs injected by Swift) is load-bearing and must not be improvised.

window.__state = {
  pc: null,
  offerReady: false,
  offerSdp: null,
  ontrackFired: false,
  hasVideoFrame: false,
  // iOS liveness channel (gateopener-672.11): timestamp (ms, from
  // requestVideoFrameCallback's `now`) of the last "frame" message posted
  // to Swift; see the throttle in pc.ontrack below.
  lastFramePostMs: 0,
  log: [],
};

function logMsg(msg) {
  const line = `[${new Date().toISOString()}] ${msg}`;
  window.__state.log.push(line);
  if (window.__state.log.length > 200) {
    window.__state.log.splice(0, window.__state.log.length - 200);
  }
  console.log(line);
  // Mirror every logMsg() line into diag (bead gateopener-672.30) so
  // play()/autoplay errors are visible in Settings > Video diagnostics on a
  // Release (TestFlight) build, where there is no debug console attached.
  // Guarded with `typeof diag === "function"` since diag() is defined AFTER
  // logMsg() below in this file and function declarations are hoisted, so
  // in practice this is always true by the time logMsg() is ever CALLED --
  // the guard exists purely so this ordering is not load-bearing.
  if (typeof diag === "function") {
    diag("log: " + line);
  }
}

// Release-build diagnostics recorder (bead gateopener-672.27). Entirely
// additive and independent of logMsg/window.__state.log above -- this exists
// so an off-LAN failure can be diagnosed from a TestFlight (Release) build,
// where there is no debug console attached. ALWAYS records into
// window.__diag (capped at 200 lines, like window.__state.log), regardless
// of platform; only POSTS each line to Swift via the "diag"
// WKScriptMessageHandler when that handler exists, so the macOS path (which
// registers no such handler) is completely unaffected beyond the negligible
// cost of appending to this array. NEVER logs a full IP address of the
// phone or door -- only candidate type (host/srflx/prflx/relay), transport
// protocol, and address family (v4/v6) are recorded, per the bead's privacy
// requirement.
window.__diag = [];
function diag(line) {
  const withTs = `[${Date.now()}] ${line}`;
  window.__diag.push(withTs);
  if (window.__diag.length > 200) {
    window.__diag.splice(0, window.__diag.length - 200);
  }
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.diag) {
    try {
      window.webkit.messageHandlers.diag.postMessage(withTs);
    } catch (err) {
      // Best-effort only; never let a diagnostics post throw into caller code.
    }
  }
}

// Address-family classifier used only for diagnostics summaries below --
// NEVER returns or logs the address itself, only "v4"/"v6"/"unknown".
function addressFamily(address) {
  if (!address) return "unknown";
  return address.indexOf(":") !== -1 ? "v6" : "v4";
}

// Summarizes one SDP's worth of "a=candidate:" lines to exactly
// {type, family, port} triples -- used both for our own local candidates
// (via pc.onicecandidate) and for the remote answer's candidate lines. SDP
// candidate line shape: "candidate:<foundation> <component> <proto> <prio>
// <address> <port> typ <type> ...". Never logs the address field itself.
function summarizeCandidateLine(candidateLine) {
  const parts = candidateLine.trim().split(/\s+/);
  // parts[0] may be "a=candidate:..." (SDP) or "candidate:..." (RTCIceCandidate.candidate).
  const proto = parts[2] ? parts[2].toLowerCase() : "unknown";
  const address = parts[4] || "";
  const port = parts[5] || "unknown";
  const typIndex = parts.indexOf("typ");
  const type = typIndex !== -1 && parts[typIndex + 1] ? parts[typIndex + 1] : "unknown";
  return { type, protocol: proto, family: addressFamily(address), port };
}

function summarizeRemoteCandidates(answerSdp) {
  const lines = answerSdp.split(/\r?\n/).filter((l) => l.indexOf("a=candidate:") === 0);
  return lines.map((l) => summarizeCandidateLine(l.substring(2)));
}

// Builds the RTCPeerConnection, wires up ontrack and the recvonly
// audio+video transceivers (audio first -- the door's answer generation is
// m-line-order sensitive), creates the offer, and waits for non-trickle ICE
// gathering to complete. Called exactly once per page load.
async function negotiate() {
  window.__state.offerReady = false;
  window.__state.offerSdp = null;
  window.__state.hasVideoFrame = false;

  // Comelit's own STUN server, pre-resolved to an IP and injected by Swift
  // as window.__ICE_SERVERS__ -- a bare mDNS-only host candidate is
  // rejected by the door station's signaling backend, and resolving the
  // STUN hostname from inside the page is unreliable. The actual
  // sequencing (see DoorVideoSession.swift): this script has already run
  // in full (this file only DEFINES negotiate()/startNegotiation()/etc. at
  // load time) and the page has finished loading before Swift injects
  // window.__ICE_SERVERS__; that injection then happens before Swift
  // calls startNegotiation(), i.e. before THIS function constructs the
  // RTCPeerConnection below -- not "before this script runs". Falls back
  // to the hostname form only if that injection did not happen (should
  // not occur in normal operation).
  const iceServerUrls = (window.__ICE_SERVERS__ && window.__ICE_SERVERS__.length)
    ? window.__ICE_SERVERS__
    : ["stun:stun.cloud.comelitgroup.com:3478"];
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: iceServerUrls }],
    iceCandidatePoolSize: 0,
  });
  logMsg("Created RTCPeerConnection with comelit STUN server(s): " + JSON.stringify(iceServerUrls));
  diag("pc created, iceServerUrls.length=" + iceServerUrls.length);
  window.__state.pc = pc;

  pc.oniceconnectionstatechange = () => { logMsg("iceConnectionState=" + pc.iceConnectionState); diag("iceConnectionState=" + pc.iceConnectionState); };
  pc.onconnectionstatechange = () => {
    logMsg("connectionState=" + pc.connectionState);
    diag("connectionState=" + pc.connectionState);
    if (pc.connectionState === "connected") {
      startSelectedPairPolling(pc);
    }
  };
  pc.onsignalingstatechange = () => { logMsg("signalingState=" + pc.signalingState); diag("signalingState=" + pc.signalingState); };
  pc.onicegatheringstatechange = () => { logMsg("iceGatheringState=" + pc.iceGatheringState); diag("iceGatheringState=" + pc.iceGatheringState); };
  pc.onicecandidateerror = (e) => logMsg("iceCandidateError: " + JSON.stringify({errorCode: e.errorCode, errorText: e.errorText, url: e.url}));

  // Local candidates as they are gathered (never logs the phone's actual
  // address -- only type/protocol/family/port, per this bead's privacy
  // requirement). event.candidate is null once gathering completes, which
  // this deliberately does not log as a "candidate" line.
  pc.onicecandidate = (event) => {
    if (!event.candidate || !event.candidate.candidate) return;
    const summary = summarizeCandidateLine(event.candidate.candidate);
    diag("local candidate: type=" + summary.type + " proto=" + summary.protocol + " family=" + summary.family + " port=" + summary.port);
  };

  pc.ontrack = (event) => {
    window.__state.ontrackFired = true;
    logMsg("ontrack fired, kind=" + event.track.kind + " id=" + event.track.id);
    diag("ontrack kind=" + event.track.kind);
    if (event.track.kind === "video") {
      const video = document.getElementById("v");
      if (event.streams && event.streams[0]) {
        video.srcObject = event.streams[0];
      } else {
        video.srcObject = new MediaStream([event.track]);
      }
      video.play().catch(err => logMsg("video.play() error: " + err));
      if (video.requestVideoFrameCallback) {
        // iOS liveness channel (gateopener-672.11): posts a frame
        // timestamp to Swift's WKScriptMessageHandler named "frame" at
        // most ~2Hz (>= 500ms since the last post), so DoorVideoSession's
        // liveness watchdog can detect a genuine stall (no new frame for
        // several seconds) off real per-frame callbacks. Guarded on
        // `window.webkit?.messageHandlers?.frame` existing so the macOS
        // path (which has no such handler registered) is completely
        // untouched -- this is purely additive.
        const onFrame = (now) => {
          if (!window.__state.hasVideoFrame) {
            logMsg("first video frame natural size: " + video.videoWidth + "x" + video.videoHeight);
            diag("first video frame " + video.videoWidth + "x" + video.videoHeight);
          }
          window.__state.hasVideoFrame = true;
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.frame) {
            if (now - window.__state.lastFramePostMs >= 500) {
              window.__state.lastFramePostMs = now;
              window.webkit.messageHandlers.frame.postMessage(now);
            }
          }
          video.requestVideoFrameCallback(onFrame);
        };
        window.__state.lastFramePostMs = 0;
        video.requestVideoFrameCallback(onFrame);
      }
    }
  };

  // audio first, then video, to match the real app's SDP m-line order (the
  // door station's answer generation is order-sensitive against the offer).
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.createDataChannel('data');

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  logMsg("setLocalDescription done, waiting for ICE gathering complete...");

  await new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') {
      resolve();
      return;
    }
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    // Safety timeout in case gathering never completes.
    setTimeout(resolve, 8000);
  });

  logMsg("ICE gathering complete (or timed out), offer ready");
  window.__state.offerSdp = pc.localDescription.sdp;
  window.__state.offerReady = true;
}

// Called from Swift once the answer SDP is obtained from the Comelit rtc/
// offer API (the PUT itself happens in Swift so the bearer token never
// reaches page JS).
window.applyAnswer = async function (answerSdp) {
  const pc = window.__state.pc;
  const remoteCandidates = summarizeRemoteCandidates(answerSdp);
  diag("remote answer candidates: " + JSON.stringify(remoteCandidates));
  await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  logMsg("setRemoteDescription(answer) done, signalingState=" + pc.signalingState);
  return true;
};

// Entry point Swift calls to start the (only) negotiation cycle for this
// session, returning the non-trickle offer SDP for Swift to PUT to
// rtc/offer with a new sessionId.
window.startNegotiation = async function () {
  await negotiate();
  return window.__state.offerSdp;
};

window.getState = function () {
  const pc = window.__state.pc;
  const video = document.getElementById("v");
  return {
    iceConnectionState: pc ? pc.iceConnectionState : null,
    connectionState: pc ? pc.connectionState : null,
    signalingState: pc ? pc.signalingState : null,
    ontrackFired: window.__state.ontrackFired,
    hasVideoFrame: window.__state.hasVideoFrame,
    videoWidth: video.videoWidth,
    videoHeight: video.videoHeight,
    log: window.__state.log,
  };
};

// Fetches pc.getStats(), summarized to exactly the fields DoorVideoSession
// needs (packetsReceived/framesDecoded/framesReceived for video,
// packetsReceived for audio), plus (bead gateopener-kgx.6)
// iceConnectionState/connectionState so the stats line alone shows whether
// ICE connected without a separate window.getState() round trip. Purely
// additive: every existing key keeps its exact prior meaning and shape.
window.getVideoStats = async function () {
  const pc = window.__state.pc;
  if (!pc) return JSON.stringify({error: 'no pc'});
  const stats = await pc.getStats();
  let video = {packetsReceived: 0, framesDecoded: 0, framesReceived: 0};
  let audio = {packetsReceived: 0};
  stats.forEach((report) => {
    if (report.type === 'inbound-rtp' && report.kind === 'video') {
      video.packetsReceived = report.packetsReceived || 0;
      video.framesDecoded = report.framesDecoded || 0;
      video.framesReceived = report.framesReceived || 0;
    }
    if (report.type === 'inbound-rtp' && report.kind === 'audio') {
      audio.packetsReceived = report.packetsReceived || 0;
    }
  });
  return JSON.stringify({
    video,
    audio,
    iceConnectionState: pc.iceConnectionState,
    connectionState: pc.connectionState,
  });
};

// EXPERIMENT (gateopener-12h.8, option (c)): draws the current video frame
// to the hidden canvas above and returns it as a base64 JPEG data URL.
// Ported verbatim (semantics unchanged) from
// ../comelit/comelit/webrtc_page.html's window.captureFrameJpeg, which is
// proven against this exact hardware -- it is how the Python reference app
// serves MJPEG. Returns null if the <video> element has no natural size yet
// (video.videoWidth/videoHeight are 0), which is deliberately the same
// signal DoorVideoSession's hasVideoFrame path already found unreliable in
// this WKWebView context -- this experiment exists to find out whether
// canvas capture is ALSO gated on that, or can succeed independently of it.
window.captureFrameJpeg = function (quality) {
  const video = document.getElementById("v");
  if (!video.videoWidth || !video.videoHeight) {
    return null;
  }
  const canvas = document.getElementById("c");
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality || 0.85);
};

// Combined per-poll bridge call (static-scene false-plateau fix): returns
// the captured JPEG data URL (or null, per captureFrameJpeg above) AND the
// current inbound-video RTP counters in ONE round trip, so
// DoorVideoFrameView's poll loop does not need two separate
// callAsyncJavaScript calls every ~125ms. `video` is null (rather than
// zeroed counters) specifically when pc.getStats() could not be read at
// all (no peer connection yet, or getStats() itself threw) -- that
// distinction matters to the Swift side, which treats a null `video` as
// "RTP counters unavailable, fall back to byte-difference detection" and
// a present-but-zero `video` as "counters obtained, currently no
// traffic". Reuses captureFrameJpeg/pc.getStats() rather than duplicating
// their logic; JSON.stringify()'d (not returned as a bridged JS object)
// to match window.getVideoStats's existing, already-proven
// stringify-then-JSONSerialization-on-the-Swift-side bridging pattern.
window.captureFrameAndStats = async function (quality) {
  const jpeg = window.captureFrameJpeg(quality);
  const pc = window.__state.pc;
  let video = null;
  if (pc) {
    try {
      const stats = await pc.getStats();
      video = {packetsReceived: 0, framesReceived: 0};
      stats.forEach((report) => {
        if (report.type === 'inbound-rtp' && report.kind === 'video') {
          video.packetsReceived = report.packetsReceived || 0;
          video.framesReceived = report.framesReceived || 0;
        }
      });
    } catch (err) {
      logMsg("captureFrameAndStats: getStats() failed: " + err);
      video = null;
    }
  }
  return JSON.stringify({jpeg: jpeg, video: video});
};

// Diagnostics only (bead gateopener-672.27): once `pc.connectionState` first
// reaches "connected" (see the onconnectionstatechange handler in
// negotiate() above), polls pc.getStats() every ~2s for the transport's
// selectedCandidatePairId and logs the local/remote candidate types,
// address families, transport state, and bytesReceived for that pair. Never
// logs an address itself. `window.__diagPairTimer` holds the interval
// handle so closeSession() below can stop it; harmless (a no-op re-poll on
// an already-closed pc) if it ever fires after teardown, since getStats()
// on a closed RTCPeerConnection simply resolves with the last-known report
// set or rejects, both handled here.
window.__diagPairTimer = null;
function startSelectedPairPolling(pc) {
  if (window.__diagPairTimer) return;
  window.__diagPairTimer = setInterval(async () => {
    try {
      const stats = await pc.getStats();
      let transport = null;
      stats.forEach((report) => {
        if (report.type === 'transport') transport = report;
      });
      if (!transport || !transport.selectedCandidatePairId) return;
      const pair = stats.get(transport.selectedCandidatePairId);
      if (!pair) return;
      const local = stats.get(pair.localCandidateId);
      const remote = stats.get(pair.remoteCandidateId);
      diag("selected pair: local(type=" + (local ? local.candidateType : "?") + " family=" + addressFamily(local ? local.address : null) +
        ") remote(type=" + (remote ? remote.candidateType : "?") + " family=" + addressFamily(remote ? remote.address : null) +
        ") state=" + pair.state + " bytesReceived=" + (pair.bytesReceived || 0));
    } catch (err) {
      // Best-effort diagnostics only; never let a polling failure surface.
    }
  }, 2000);
}
function stopSelectedPairPolling() {
  if (window.__diagPairTimer) {
    clearInterval(window.__diagPairTimer);
    window.__diagPairTimer = null;
  }
}

// Re-issues video.play() if the element is currently paused (bead
// gateopener-672.30): iOS pauses/refuses inline media playback on a hidden
// (opacity-0) WKWebView, and DoorVideoView now keeps the web view visible
// at all times specifically so play() can succeed here instead of leaving
// the element paused with a native "tap to play" glyph. No-op (returns
// "no-video") if the video element is missing -- guards this addition so a
// page variant without a #v element (there is none today, but future-proof
// per this bead's brief) never throws. Returns a short status string Swift
// records into diagnostics; never throws.
window.ensurePlaying = async function () {
  const video = document.getElementById("v");
  if (!video) return "no-video";
  if (!video.paused) return "playing";
  try {
    await video.play();
    return "resumed";
  } catch (e) {
    diag("play() rejected: " + (e && e.name) + " " + (e && e.message));
    return "rejected:" + (e && e.name);
  }
};

// Set by Swift (via callAsyncJavaScript) immediately before it calls
// window.closeSession(), so the video-element "pause" listener below can
// tell a teardown-triggered pause (expected, must NOT retry play()) apart
// from an unexpected mid-session pause (must retry). closeSession() itself
// stays byte-identical to its pre-gateopener-672.30 form -- this flag is
// set from a SEPARATE function Swift calls first, rather than added inside
// closeSession, specifically so closeSession's body never changes.
window.markClosing = function () {
  window.__state.closing = true;
};

// Video-element playback event listeners (bead gateopener-672.30): every
// event just diag()s its name plus paused/readyState for visibility into
// why iOS may have paused playback. On "pause", if the peer connection is
// still "connected" and the session is not closing (see markClosing above),
// this is an UNEXPECTED pause (not the deliberate teardown blanking in
// closeSession), so play() is retried once after 250ms and the outcome is
// diag()'d. Guarded on the #v element existing so this whole block is a
// no-op on any page variant without one.
(function () {
  const video = document.getElementById("v");
  if (!video) return;
  const events = ["play", "playing", "pause", "stalled", "suspend", "waiting", "ended"];
  events.forEach((name) => {
    video.addEventListener(name, () => {
      diag("video event: " + name + " paused=" + video.paused + " readyState=" + video.readyState);
      if (name === "pause") {
        const pc = window.__state.pc;
        if (pc && pc.connectionState === "connected" && !window.__state.closing) {
          setTimeout(() => {
            video.play().then(
              () => diag("retry play() after unexpected pause: resumed"),
              (e) => diag("retry play() after unexpected pause: rejected " + (e && e.name) + " " + (e && e.message))
            );
          }, 250);
        }
      }
    });
  });
})();

// Tears down the RTCPeerConnection. Idempotent: safe to call even if no
// session was ever started, or if called more than once.
window.closeSession = function () {
  stopSelectedPairPolling();
  const pc = window.__state.pc;
  if (pc) {
    try {
      pc.close();
    } catch (err) {
      logMsg("error closing RTCPeerConnection: " + err);
    }
  }
  window.__state.pc = null;
  const video = document.getElementById("v");
  video.srcObject = null;
  return true;
};
</script>
</body>
</html>
