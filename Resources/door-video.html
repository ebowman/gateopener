<!DOCTYPE html>
<html>
<head><title>comelit door camera</title></head>
<body style="margin:0;background:#000">
<video id="v" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;background:#222"></video>
<canvas id="c" style="display:none"></canvas>
<script>
// Drives ONE WebRTC session against the Comelit door camera, via WKWebView.
// This is a stripped-down copy of ../comelit/comelit/webrtc_page.html
// (itself the source for the proven scratchpad/webrtc-spike harness): the
// stale-frame watchdog and renegotiation machinery have been DELIBERATELY
// removed. DoorVideoSession (Swift) establishes exactly one session and
// never renegotiates -- see the gateopener-12h epic and bd memories
// gateopener-yjn-spike-result-wkwebview-webkit-s-own /
// gateopener-yjn-spike-addendum-answers-to-a-follow for why this recipe
// (recvonly transceivers, audio before video, non-trickle ICE, pre-resolved
// STUN IPs injected by Swift) is load-bearing and must not be improvised.

window.__state = {
  pc: null,
  offerReady: false,
  offerSdp: null,
  cancelGathering: null,
  ontrackFired: false,
  hasVideoFrame: false,
  // iOS liveness channel (gateopener-672.11): timestamp (ms, from
  // requestVideoFrameCallback's `now`) of the last "frame" message posted
  // to Swift; see the throttle in pc.ontrack below.
  lastFramePostMs: 0,
  log: [],
};

// Non-trickle signaling uses one bounded, immutable SDP snapshot. Prefer a
// normal complete gathering event, but after 15s a snapshot may proceed only
// when the actual localDescription contains a valid UDP srflx/relay candidate.
// A host-only or malformed SDP still fails explicitly at the deadline.
const ICE_GATHERING_TIMEOUT_MS = 15000;
const ICE_WAIT_COMPLETE = "complete";
const ICE_WAIT_DEADLINE_CANDIDATE = "deadline-with-gathered-candidate";

// QUIET-PERIOD rule (gateopener-4r7): on networks where 7 of our 8 STUN
// servers never answer, iceGatheringState never reaches 'complete' and the
// page used to burn the entire 15s ICE_GATHERING_TIMEOUT_MS before
// publishing the offer (field evidence: session-start-to-first-frame
// ~19s). Once a routable pair exists -- one host candidate AND one UDP
// srflx/relay candidate -- there is no reason to keep waiting for every
// remaining STUN server to time out. See iceWaitDecision() below and its
// wiring into waitForBoundedIceSnapshot(). The 15s hard deadline above is
// UNCHANGED and still the final fallback (gateopener-ndn).
const ICE_WAIT_QUIET_PERIOD = "quiet-period";
const ICE_WAIT_MAX_WAIT_CANDIDATE = "max-wait-with-candidate";
const ICE_WAIT_WAIT = "wait";
const ICE_QUIET_PERIOD_MS = 600;
const ICE_MAX_WAIT_MS = 4000;
const ICE_WAIT_TICK_MS = 100;

function negotiationError(code, message) {
  const error = new Error(message);
  error.name = "DoorVideoNegotiationError";
  error.code = code;
  return error;
}

function iceGatheringClosedError() {
  const error = negotiationError(
    "ice-gathering-closed",
    "Video session closed before ICE gathering completed"
  );
  diag("negotiation failed: " + error.code);
  return error;
}

function iceGatheringTimeoutError() {
  const error = negotiationError(
    "ice-gathering-timeout",
    "ICE gathering did not produce a usable bounded snapshot within 15 seconds"
  );
  diag("negotiation failed: " + error.code + " after " + ICE_GATHERING_TIMEOUT_MS + "ms");
  return error;
}

function isValidIPv4Address(address) {
  const octets = address.split(".");
  return octets.length === 4 && octets.every((octet) =>
    /^(0|[1-9]\d{0,2})$/.test(octet) && Number(octet) <= 255
  );
}

// Validates IPv6 syntax without assuming a particular address range. This
// accepts compressed and IPv4-embedded forms, including NAT64 addresses.
function isValidIPv6Address(address) {
  const zoneIndex = address.indexOf("%");
  if (zoneIndex !== -1) {
    if (address.indexOf("%", zoneIndex + 1) !== -1 ||
        !/^[A-Za-z0-9_.~-]+$/.test(address.substring(zoneIndex + 1))) {
      return false;
    }
    address = address.substring(0, zoneIndex);
  }
  if (address.indexOf(":") === -1 || !/^[0-9A-Fa-f:.]+$/.test(address)) {
    return false;
  }
  if ((address.match(/::/g) || []).length > 1) return false;

  const compressed = address.indexOf("::") !== -1;
  const sides = compressed ? address.split("::") : [address];
  const groups = [];
  for (const side of sides) {
    if (!side) continue;
    for (const group of side.split(":")) {
      if (!group) return false;
      groups.push(group);
    }
  }

  let groupCount = groups.length;
  const ipv4Groups = groups.filter((group) => group.indexOf(".") !== -1);
  if (ipv4Groups.length > 1) return false;
  if (ipv4Groups.length === 1) {
    if (groups[groups.length - 1] !== ipv4Groups[0] ||
        !address.endsWith(ipv4Groups[0]) ||
        !isValidIPv4Address(ipv4Groups[0])) {
      return false;
    }
    groupCount += 1; // An embedded IPv4 address occupies two 16-bit groups.
  }
  for (const group of groups) {
    if (group.indexOf(".") === -1 && !/^[0-9A-Fa-f]{1,4}$/.test(group)) {
      return false;
    }
  }
  return compressed ? groupCount < 8 : groupCount === 8;
}

function isValidCandidateAddress(address) {
  return isValidIPv4Address(address) || isValidIPv6Address(address);
}

function isUnsignedIntegerInRange(token, minimum, maximum) {
  return /^\d+$/.test(token) &&
    Number.isSafeInteger(Number(token)) &&
    Number(token) >= minimum &&
    Number(token) <= maximum;
}

// A deadline fallback is based only on a real, structurally valid SDP
// candidate line. Candidate events are deliberately ignored because they can
// race localDescription updates and cannot be the published non-trickle SDP.
function isQualifyingDeadlineCandidateLine(line) {
  const parts = line.trim().split(/\s+/);
  if (parts.length < 8 || !/^a=candidate:\S+$/.test(parts[0])) return false;

  const type = parts[7] ? parts[7].toLowerCase() : "";
  if (!isUnsignedIntegerInRange(parts[1], 1, 256) ||
      parts[2].toLowerCase() !== "udp" ||
      !isUnsignedIntegerInRange(parts[3], 0, 4294967295) ||
      !isValidCandidateAddress(parts[4]) ||
      !isUnsignedIntegerInRange(parts[5], 1, 65535) ||
      parts[6] !== "typ" ||
      (type !== "srflx" && type !== "relay")) {
    return false;
  }

  for (let index = 8; index < parts.length; index += 2) {
    if (index + 1 >= parts.length) return false;
    const name = parts[index].toLowerCase();
    const value = parts[index + 1];
    if (name === "raddr" && !isValidCandidateAddress(value)) return false;
    if (name === "rport" && !isUnsignedIntegerInRange(value, 0, 65535)) return false;
  }
  return true;
}

function sdpHasQualifyingDeadlineCandidate(sdp) {
  if (typeof sdp !== "string") return false;
  return sdp.split(/\r?\n/).some((line) =>
    line.indexOf("a=candidate:") === 0 &&
    isQualifyingDeadlineCandidateLine(line)
  );
}

// Pure decision function for the bounded ICE wait (gateopener-4r7). Takes
// only counters/booleans about candidates gathered so far -- no pc, no
// timers -- so it is exposed at the top level (becomes window.
// iceWaitDecision, same as the other pure helpers above) purely so
// Tests/door-video-negotiation.test.js can unit-test the full rule table
// directly, without driving a whole RTCPeerConnection.
//
// Rule precedence (first match wins):
//   1. "complete"                         -- gatheringComplete is true.
//   2. "quiet-period"                     -- a host AND a UDP srflx/relay
//                                             candidate have both been
//                                             gathered, and quietMs has
//                                             passed since the last one
//                                             arrived.
//   3. "max-wait-with-candidate"          -- same host+srflx/relay
//                                             requirement, but gates on
//                                             maxWaitMs since the wait
//                                             STARTED instead -- this is
//                                             what fires if a candidate
//                                             keeps trickling in faster
//                                             than quietMs forever.
//   4. "deadline-with-gathered-candidate" -- hardDeadlineMs has elapsed.
//                                             This is a SIGNAL ONLY: the
//                                             caller must still run the
//                                             existing
//                                             sdpHasQualifyingDeadlineCandidate
//                                             check against the real
//                                             localDescription before
//                                             treating it as success
//                                             (gateopener-ndn, unchanged).
//   5. "wait"                             -- none of the above yet.
function iceWaitDecision(params) {
  const {
    hasHost,
    hasSrflxOrRelay,
    msSinceLastCandidate,
    msSinceStart,
    gatheringComplete,
    quietMs = ICE_QUIET_PERIOD_MS,
    maxWaitMs = ICE_MAX_WAIT_MS,
    hardDeadlineMs = ICE_GATHERING_TIMEOUT_MS,
  } = params;

  if (gatheringComplete) return ICE_WAIT_COMPLETE;

  // MUTATION CHECK: dropping the `hasSrflxOrRelay` requirement here (i.e.
  // gating only on hasHost) would make a host-only candidate set fire
  // "quiet-period"/"max-wait-with-candidate" once their time thresholds
  // pass -- the host-only case in the rule table below asserts "wait" and
  // would fail.
  const hasQualifyingPair = hasHost && hasSrflxOrRelay;
  if (hasQualifyingPair && msSinceLastCandidate >= quietMs) return ICE_WAIT_QUIET_PERIOD;
  if (hasQualifyingPair && msSinceStart >= maxWaitMs) return ICE_WAIT_MAX_WAIT_CANDIDATE;
  if (msSinceStart >= hardDeadlineMs) return ICE_WAIT_DEADLINE_CANDIDATE;
  return ICE_WAIT_WAIT;
}

// Classifies one gathered LOCAL candidate line (as delivered by
// pc.onicecandidate's event.candidate.candidate -- NOT SDP-prefixed) as
// "host", "srflx-or-relay", or null (anything else: TCP, prflx, malformed
// -- "count only UDP" per this bead). Reuses
// isQualifyingDeadlineCandidateLine (which expects the "a=candidate:" SDP
// form) for the srflx/relay test so the quiet-period/max-wait rule and the
// existing 15s deadline rule can never disagree about what qualifies.
function classifyGatheredIceCandidate(candidateLine) {
  const summary = summarizeCandidateLine(candidateLine);
  if (summary.protocol !== "udp") return null;
  if (summary.type === "host") return "host";
  const sdpLine = candidateLine.indexOf("a=candidate:") === 0
    ? candidateLine
    : "a=" + candidateLine;
  return isQualifyingDeadlineCandidateLine(sdpLine) ? "srflx-or-relay" : null;
}

function createIceCandidateTracker() {
  return { hasHost: false, hasSrflxOrRelay: false, lastCandidateAt: null, count: 0 };
}

function waitForBoundedIceSnapshot(pc) {
  if (pc.iceGatheringState === "complete") {
    return Promise.resolve(ICE_WAIT_COMPLETE);
  }

  const waitStartedAt = Date.now();
  const tracker = pc.__iceTracker || (pc.__iceTracker = createIceCandidateTracker());

  return new Promise((resolve, reject) => {
    let settled = false;
    let tickTimer = null;

    const cleanup = () => {
      if (tickTimer !== null) clearTimeout(tickTimer);
      pc.removeEventListener("icegatheringstatechange", checkComplete);
      pc.removeEventListener("connectionstatechange", checkClosed);
      pc.removeEventListener("signalingstatechange", checkClosed);
      if (window.__state.cancelGathering === cancel) {
        window.__state.cancelGathering = null;
      }
      if (pc.__iceWaitEvaluate === evaluate) {
        pc.__iceWaitEvaluate = null;
      }
    };
    const finish = (action) => {
      if (settled) return;
      settled = true;
      cleanup();
      action();
    };
    // Resolves with `rule` and logs both the new diagnostic line (this
    // bead) and, via negotiate()'s existing "ICE snapshot published: ..."
    // line downstream, the same rule name.
    const publish = (rule) => {
      const elapsedMs = Date.now() - waitStartedAt;
      diag("ICE wait result: " + rule + " after " + tracker.count + " candidates (" + elapsedMs + "ms)");
      finish(() => resolve(rule));
    };
    const checkComplete = () => {
      if (pc.iceGatheringState === "complete") publish(ICE_WAIT_COMPLETE);
    };
    const checkClosed = () => {
      if (pc.connectionState === "closed" || pc.signalingState === "closed") {
        cancel();
      }
    };
    const cancel = () => {
      finish(() => reject(iceGatheringClosedError()));
    };
    // Evaluated on every qualifying candidate event (via
    // pc.__iceWaitEvaluate, wired up in negotiate()'s pc.onicecandidate)
    // and on every ICE_WAIT_TICK_MS timer tick below -- whichever notices
    // a rule match first resolves. Only the hard-deadline branch re-checks
    // the real localDescription SDP (existing gateopener-ndn behaviour,
    // unchanged); the quiet-period/max-wait branches trust the tracker.
    const evaluate = () => {
      if (settled) return;
      const now = Date.now();
      const decision = iceWaitDecision({
        hasHost: tracker.hasHost,
        hasSrflxOrRelay: tracker.hasSrflxOrRelay,
        msSinceLastCandidate: tracker.lastCandidateAt === null ? Infinity : now - tracker.lastCandidateAt,
        msSinceStart: now - waitStartedAt,
        gatheringComplete: pc.iceGatheringState === "complete",
      });
      if (decision === ICE_WAIT_WAIT) return;
      if (decision === ICE_WAIT_DEADLINE_CANDIDATE) {
        const sdp = pc.localDescription && pc.localDescription.sdp;
        if (sdpHasQualifyingDeadlineCandidate(sdp)) {
          publish(ICE_WAIT_DEADLINE_CANDIDATE);
        } else {
          finish(() => reject(iceGatheringTimeoutError()));
        }
        return;
      }
      publish(decision); // "complete" | "quiet-period" | "max-wait-with-candidate"
    };
    const tick = () => {
      if (settled) return;
      evaluate();
      if (!settled) tickTimer = setTimeout(tick, ICE_WAIT_TICK_MS);
    };

    pc.addEventListener("icegatheringstatechange", checkComplete);
    pc.addEventListener("connectionstatechange", checkClosed);
    pc.addEventListener("signalingstatechange", checkClosed);
    window.__state.cancelGathering = cancel;
    pc.__iceWaitEvaluate = evaluate;
    tickTimer = setTimeout(tick, ICE_WAIT_TICK_MS);

    // Cover a close/complete transition that raced listener installation.
    checkClosed();
    checkComplete();
  });
}

function logMsg(msg) {
  const line = `[${new Date().toISOString()}] ${msg}`;
  window.__state.log.push(line);
  if (window.__state.log.length > 200) {
    window.__state.log.splice(0, window.__state.log.length - 200);
  }
  console.log(line);
  // Mirror every logMsg() line into diag (bead gateopener-672.30) so
  // play()/autoplay errors are visible in Settings > Video diagnostics on a
  // Release (TestFlight) build, where there is no debug console attached.
  // Guarded with `typeof diag === "function"` since diag() is defined AFTER
  // logMsg() below in this file and function declarations are hoisted, so
  // in practice this is always true by the time logMsg() is ever CALLED --
  // the guard exists purely so this ordering is not load-bearing.
  if (typeof diag === "function") {
    diag("log: " + line);
  }
}

// Release-build diagnostics recorder (bead gateopener-672.27). Entirely
// additive and independent of logMsg/window.__state.log above -- this exists
// so an off-LAN failure can be diagnosed from a TestFlight (Release) build,
// where there is no debug console attached. ALWAYS records into
// window.__diag (capped at 200 lines, like window.__state.log), regardless
// of platform; only POSTS each line to Swift via the "diag"
// WKScriptMessageHandler when that handler exists, so the macOS path (which
// registers no such handler) is completely unaffected beyond the negligible
// cost of appending to this array. NEVER logs a full IP address of the
// phone or door -- only candidate type (host/srflx/prflx/relay), transport
// protocol, and address family (v4/v6) are recorded, per the bead's privacy
// requirement.
window.__diag = [];
function diag(line) {
  const withTs = `[${Date.now()}] ${line}`;
  window.__diag.push(withTs);
  if (window.__diag.length > 200) {
    window.__diag.splice(0, window.__diag.length - 200);
  }
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.diag) {
    try {
      window.webkit.messageHandlers.diag.postMessage(withTs);
    } catch (err) {
      // Best-effort only; never let a diagnostics post throw into caller code.
    }
  }
}

// Address-family classifier used only for diagnostics summaries below --
// NEVER returns or logs the address itself, only "v4"/"v6"/"unknown".
function addressFamily(address) {
  if (!address) return "unknown";
  return address.indexOf(":") !== -1 ? "v6" : "v4";
}

// Summarizes one SDP's worth of "a=candidate:" lines to exactly
// {type, family, port} triples -- used both for our own local candidates
// (via pc.onicecandidate) and for the remote answer's candidate lines. SDP
// candidate line shape: "candidate:<foundation> <component> <proto> <prio>
// <address> <port> typ <type> ...". Never logs the address field itself.
function summarizeCandidateLine(candidateLine) {
  const parts = candidateLine.trim().split(/\s+/);
  // parts[0] may be "a=candidate:..." (SDP) or "candidate:..." (RTCIceCandidate.candidate).
  const proto = parts[2] ? parts[2].toLowerCase() : "unknown";
  const address = parts[4] || "";
  const port = parts[5] || "unknown";
  const typIndex = parts.indexOf("typ");
  const type = typIndex !== -1 && parts[typIndex + 1] ? parts[typIndex + 1] : "unknown";
  return { type, protocol: proto, family: addressFamily(address), port };
}

function summarizeRemoteCandidates(answerSdp) {
  const lines = answerSdp.split(/\r?\n/).filter((l) => l.indexOf("a=candidate:") === 0);
  return lines.map((l) => summarizeCandidateLine(l.substring(2)));
}

// Builds the RTCPeerConnection, wires up ontrack and the recvonly
// audio+video transceivers (audio first -- the door's answer generation is
// m-line-order sensitive), creates the offer, and waits for a bounded
// non-trickle ICE snapshot. Called exactly once per page load.
async function negotiate() {
  window.__state.offerReady = false;
  window.__state.offerSdp = null;
  window.__state.hasVideoFrame = false;

  // Comelit's own STUN server, pre-resolved to an IP and injected by Swift
  // as window.__ICE_SERVERS__ -- a bare mDNS-only host candidate is
  // rejected by the door station's signaling backend, and resolving the
  // STUN hostname from inside the page is unreliable. The actual
  // sequencing (see DoorVideoSession.swift): this script has already run
  // in full (this file only DEFINES negotiate()/startNegotiation()/etc. at
  // load time) and the page has finished loading before Swift injects
  // window.__ICE_SERVERS__; that injection then happens before Swift
  // calls startNegotiation(), i.e. before THIS function constructs the
  // RTCPeerConnection below -- not "before this script runs". Falls back
  // to the hostname form only if that injection did not happen (should
  // not occur in normal operation).
  const iceServerUrls = (window.__ICE_SERVERS__ && window.__ICE_SERVERS__.length)
    ? window.__ICE_SERVERS__
    : ["stun:stun.cloud.comelitgroup.com:3478"];
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: iceServerUrls }],
    iceCandidatePoolSize: 0,
  });
  logMsg("Created RTCPeerConnection with comelit STUN server(s): " + JSON.stringify(iceServerUrls));
  diag("pc created, iceServerUrls.length=" + iceServerUrls.length);
  window.__state.pc = pc;

  pc.oniceconnectionstatechange = () => { logMsg("iceConnectionState=" + pc.iceConnectionState); diag("iceConnectionState=" + pc.iceConnectionState); };
  pc.onconnectionstatechange = () => {
    logMsg("connectionState=" + pc.connectionState);
    diag("connectionState=" + pc.connectionState);
    if (pc.connectionState === "connected") {
      startSelectedPairPolling(pc);
    }
  };
  pc.onsignalingstatechange = () => { logMsg("signalingState=" + pc.signalingState); diag("signalingState=" + pc.signalingState); };
  pc.onicegatheringstatechange = () => { logMsg("iceGatheringState=" + pc.iceGatheringState); diag("iceGatheringState=" + pc.iceGatheringState); };
  pc.onicecandidateerror = (e) => logMsg("iceCandidateError: " + JSON.stringify({errorCode: e.errorCode, errorText: e.errorText, url: e.url}));

  // Local candidates as they are gathered (never logs the phone's actual
  // address -- only type/protocol/family/port, per this bead's privacy
  // requirement). event.candidate is null once gathering completes, which
  // this deliberately does not log as a "candidate" line.
  pc.onicecandidate = (event) => {
    if (!event.candidate || !event.candidate.candidate) return;
    const candidateLine = event.candidate.candidate;
    const summary = summarizeCandidateLine(candidateLine);
    diag("local candidate: type=" + summary.type + " proto=" + summary.protocol + " family=" + summary.family + " port=" + summary.port);

    // Feeds the quiet-period/max-wait rule (gateopener-4r7). The tracker is
    // created unconditionally (not just while a waitForBoundedIceSnapshot()
    // watcher is attached) so a candidate arriving in the brief window
    // before the watcher attaches is not lost; pc.__iceWaitEvaluate is only
    // set while a watcher is actually waiting.
    const tracker = pc.__iceTracker || (pc.__iceTracker = createIceCandidateTracker());
    const kind = classifyGatheredIceCandidate(candidateLine);
    if (kind === "host") tracker.hasHost = true;
    if (kind === "srflx-or-relay") tracker.hasSrflxOrRelay = true;
    if (kind !== null) {
      tracker.count += 1;
      tracker.lastCandidateAt = Date.now();
    }
    if (pc.__iceWaitEvaluate) pc.__iceWaitEvaluate();
  };

  pc.ontrack = (event) => {
    window.__state.ontrackFired = true;
    logMsg("ontrack fired, kind=" + event.track.kind + " id=" + event.track.id);
    diag("ontrack kind=" + event.track.kind);
    if (event.track.kind === "video") {
      const video = document.getElementById("v");
      if (event.streams && event.streams[0]) {
        video.srcObject = event.streams[0];
      } else {
        video.srcObject = new MediaStream([event.track]);
      }
      video.play().catch(err => logMsg("video.play() error: " + err));
      if (video.requestVideoFrameCallback) {
        // iOS liveness channel (gateopener-672.11): posts a frame
        // timestamp to Swift's WKScriptMessageHandler named "frame" at
        // most ~2Hz (>= 500ms since the last post), so DoorVideoSession's
        // liveness watchdog can detect a genuine stall (no new frame for
        // several seconds) off real per-frame callbacks. Guarded on
        // `window.webkit?.messageHandlers?.frame` existing so the macOS
        // path (which has no such handler registered) is completely
        // untouched -- this is purely additive.
        const onFrame = (now) => {
          if (!window.__state.hasVideoFrame) {
            logMsg("first video frame natural size: " + video.videoWidth + "x" + video.videoHeight);
            diag("first video frame " + video.videoWidth + "x" + video.videoHeight);
          }
          window.__state.hasVideoFrame = true;
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.frame) {
            if (now - window.__state.lastFramePostMs >= 500) {
              window.__state.lastFramePostMs = now;
              window.webkit.messageHandlers.frame.postMessage(now);
            }
          }
          video.requestVideoFrameCallback(onFrame);
        };
        window.__state.lastFramePostMs = 0;
        video.requestVideoFrameCallback(onFrame);
      }
    }
  };

  // audio first, then video, to match the real app's SDP m-line order (the
  // door station's answer generation is order-sensitive against the offer).
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.createDataChannel('data');

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  logMsg("setLocalDescription done, waiting for bounded ICE snapshot...");

  const iceWaitResult = await waitForBoundedIceSnapshot(pc);
  if (window.__state.pc !== pc ||
      pc.connectionState === "closed" ||
      pc.signalingState === "closed") {
    throw iceGatheringClosedError();
  }

  // Capture exactly once after the close/replacement guard. If the deadline
  // path qualified an earlier localDescription but the final one lost that
  // candidate, fail rather than publishing an empty/host-only offer.
  const offerSdp = pc.localDescription && pc.localDescription.sdp;
  if (iceWaitResult === ICE_WAIT_DEADLINE_CANDIDATE &&
      !sdpHasQualifyingDeadlineCandidate(offerSdp)) {
    throw iceGatheringTimeoutError();
  }

  // "ICE snapshot published: <rule label>" -- keeps the exact strings the
  // ICE_WAIT_COMPLETE/ICE_WAIT_DEADLINE_CANDIDATE cases always used, and
  // adds a label for the two new quiet-period/max-wait rules (gateopener-4r7).
  const ICE_WAIT_RULE_LABELS = {
    [ICE_WAIT_COMPLETE]: "complete",
    [ICE_WAIT_QUIET_PERIOD]: "quiet period",
    [ICE_WAIT_MAX_WAIT_CANDIDATE]: "max wait with candidate",
    [ICE_WAIT_DEADLINE_CANDIDATE]: "deadline with gathered candidate",
  };
  const ruleLabel = ICE_WAIT_RULE_LABELS[iceWaitResult] || iceWaitResult;
  logMsg("ICE snapshot published (" + ruleLabel + "), offer ready");
  diag("ICE snapshot published: " + ruleLabel);
  window.__state.offerSdp = offerSdp;
  window.__state.offerReady = true;
}

// Called from Swift once the answer SDP is obtained from the Comelit rtc/
// offer API (the PUT itself happens in Swift so the bearer token never
// reaches page JS).
window.applyAnswer = async function (answerSdp) {
  const pc = window.__state.pc;
  const remoteCandidates = summarizeRemoteCandidates(answerSdp);
  diag("remote answer candidates: " + JSON.stringify(remoteCandidates));
  await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  logMsg("setRemoteDescription(answer) done, signalingState=" + pc.signalingState);
  return true;
};

// Entry point Swift calls to start the (only) negotiation cycle for this
// session, returning the non-trickle offer SDP for Swift to PUT to
// rtc/offer with a new sessionId.
window.startNegotiation = async function () {
  await negotiate();
  return window.__state.offerSdp;
};

window.getState = function () {
  const pc = window.__state.pc;
  const video = document.getElementById("v");
  return {
    iceConnectionState: pc ? pc.iceConnectionState : null,
    connectionState: pc ? pc.connectionState : null,
    signalingState: pc ? pc.signalingState : null,
    ontrackFired: window.__state.ontrackFired,
    hasVideoFrame: window.__state.hasVideoFrame,
    videoWidth: video.videoWidth,
    videoHeight: video.videoHeight,
    log: window.__state.log,
  };
};

// Fetches pc.getStats(), summarized to exactly the fields DoorVideoSession
// needs (packetsReceived/framesDecoded/framesReceived for video,
// packetsReceived for audio), plus (bead gateopener-kgx.6)
// iceConnectionState/connectionState so the stats line alone shows whether
// ICE connected without a separate window.getState() round trip. Purely
// additive: every existing key keeps its exact prior meaning and shape.
//
// bead gateopener-kgx.11: adds packetsLost/nackCount/pliCount/firCount/
// keyFramesDecoded/frameWidth/frameHeight to `video` (and packetsLost to
// `audio`) so a relay-path session with packetsReceived growing but
// framesDecoded=0 (see memory gateopener-remote-video-relay-path-no-frames)
// can be split into "keyframe never arrived / door ignores PLI"
// (packetsLost~0, pliCount growing, keyFramesDecoded=0) vs. "packets
// dropped on the path" (packetsLost growing). All new fields are numeric,
// default 0 when the report doesn't carry them yet.
//
// `jitter` is deliberately NOT placed inside `video` -- it is exposed as a
// separate top-level `jitterMs` key instead. jitter fluctuates almost every
// poll (every ~300ms per watchForFirstFrame's poll interval), and the Swift
// side's change-detection in DoorVideoSession.watchForFirstFrame compares
// the ENTIRE raw JSON string against the previous poll's, logging a new
// "video stats: ..." line only on change. If jitter lived inside `video`,
// every single poll would count as "changed" and spam one log line per
// ~300ms for the whole session. Keeping it as a sibling top-level key lets
// the Swift side strip/ignore just that key when deciding whether the
// interesting counters (video/audio/ICE/connection state) actually
// changed, while still surfacing jitter in the JSON for a human reading
// the raw diag line. Rounded to 3 decimals to keep the value itself
// readable (RTCStatsReport reports jitter in seconds, e.g. 0.012).
window.getVideoStats = async function () {
  const pc = window.__state.pc;
  if (!pc) return JSON.stringify({error: 'no pc'});
  const stats = await pc.getStats();
  let video = {
    packetsReceived: 0,
    framesDecoded: 0,
    framesReceived: 0,
    packetsLost: 0,
    nackCount: 0,
    pliCount: 0,
    firCount: 0,
    keyFramesDecoded: 0,
    frameWidth: 0,
    frameHeight: 0,
  };
  let audio = {packetsReceived: 0, packetsLost: 0};
  let jitterMs = 0;
  stats.forEach((report) => {
    if (report.type === 'inbound-rtp' && report.kind === 'video') {
      video.packetsReceived = report.packetsReceived || 0;
      video.framesDecoded = report.framesDecoded || 0;
      video.framesReceived = report.framesReceived || 0;
      video.packetsLost = report.packetsLost || 0;
      video.nackCount = report.nackCount || 0;
      video.pliCount = report.pliCount || 0;
      video.firCount = report.firCount || 0;
      video.keyFramesDecoded = report.keyFramesDecoded || 0;
      video.frameWidth = report.frameWidth || 0;
      video.frameHeight = report.frameHeight || 0;
      jitterMs = Math.round((report.jitter || 0) * 1000) / 1000;
    }
    if (report.type === 'inbound-rtp' && report.kind === 'audio') {
      audio.packetsReceived = report.packetsReceived || 0;
      audio.packetsLost = report.packetsLost || 0;
    }
  });
  return JSON.stringify({
    video,
    audio,
    iceConnectionState: pc.iceConnectionState,
    connectionState: pc.connectionState,
    jitterMs,
  });
};

// EXPERIMENT (gateopener-12h.8, option (c)): draws the current video frame
// to the hidden canvas above and returns it as a base64 JPEG data URL.
// Ported verbatim (semantics unchanged) from
// ../comelit/comelit/webrtc_page.html's window.captureFrameJpeg, which is
// proven against this exact hardware -- it is how the Python reference app
// serves MJPEG. Returns null if the <video> element has no natural size yet
// (video.videoWidth/videoHeight are 0), which is deliberately the same
// signal DoorVideoSession's hasVideoFrame path already found unreliable in
// this WKWebView context -- this experiment exists to find out whether
// canvas capture is ALSO gated on that, or can succeed independently of it.
window.captureFrameJpeg = function (quality) {
  const video = document.getElementById("v");
  if (!video.videoWidth || !video.videoHeight) {
    return null;
  }
  const canvas = document.getElementById("c");
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality || 0.85);
};

// Combined per-poll bridge call (static-scene false-plateau fix): returns
// the captured JPEG data URL (or null, per captureFrameJpeg above) AND the
// current inbound-video RTP counters in ONE round trip, so
// DoorVideoFrameView's poll loop does not need two separate
// callAsyncJavaScript calls every ~125ms. `video` is null (rather than
// zeroed counters) specifically when pc.getStats() could not be read at
// all (no peer connection yet, or getStats() itself threw) -- that
// distinction matters to the Swift side, which treats a null `video` as
// "RTP counters unavailable, fall back to byte-difference detection" and
// a present-but-zero `video` as "counters obtained, currently no
// traffic". Reuses captureFrameJpeg/pc.getStats() rather than duplicating
// their logic; JSON.stringify()'d (not returned as a bridged JS object)
// to match window.getVideoStats's existing, already-proven
// stringify-then-JSONSerialization-on-the-Swift-side bridging pattern.
window.captureFrameAndStats = async function (quality) {
  const jpeg = window.captureFrameJpeg(quality);
  const pc = window.__state.pc;
  let video = null;
  if (pc) {
    try {
      const stats = await pc.getStats();
      video = {packetsReceived: 0, framesReceived: 0};
      stats.forEach((report) => {
        if (report.type === 'inbound-rtp' && report.kind === 'video') {
          video.packetsReceived = report.packetsReceived || 0;
          video.framesReceived = report.framesReceived || 0;
        }
      });
    } catch (err) {
      logMsg("captureFrameAndStats: getStats() failed: " + err);
      video = null;
    }
  }
  return JSON.stringify({jpeg: jpeg, video: video});
};

// One-shot candidate-pair diagnostics dump (bead gateopener-6s8.6): unlike
// startSelectedPairPolling below (which only reports the CURRENTLY selected
// pair, and only once connected), this walks EVERY candidate-pair report in
// pc.getStats() so a failure that never reaches "connected" still yields a
// full picture of what was tried. Swift calls this once, at most, per
// terminal event (the 20s no-video deadline, or a post-answer-applied
// "failed" ICE/connection state) -- never polled. Reuses addressFamily and
// the candidate-pair report's localCandidateId/remoteCandidateId to resolve
// the matching local-candidate/remote-candidate reports, exactly like
// startSelectedPairPolling does for the single selected pair. NEVER logs an
// address or port -- only type/protocol/family per this bead's privacy
// requirement -- and must never throw: any failure is captured into the
// returned JSON's "error" field instead. Capped at 12 pairs.
window.getCandidatePairs = async function () {
  try {
    const pc = window.__state.pc;
    if (!pc) {
      return JSON.stringify({ error: "no pc" });
    }
    const stats = await pc.getStats();
    const candidateReports = new Map();
    const pairReports = [];
    const remoteTypeSet = new Set();
    stats.forEach((report) => {
      if (report.type === "local-candidate" || report.type === "remote-candidate") {
        candidateReports.set(report.id, report);
        if (report.type === "remote-candidate" && report.candidateType) {
          remoteTypeSet.add(report.candidateType);
        }
      } else if (report.type === "candidate-pair") {
        pairReports.push(report);
      }
    });

    const pairs = pairReports.slice(0, 12).map((pair) => {
      const local = candidateReports.get(pair.localCandidateId);
      const remote = candidateReports.get(pair.remoteCandidateId);
      return {
        state: pair.state || "unknown",
        nominated: !!pair.nominated,
        local: {
          type: local ? (local.candidateType || "unknown") : "unknown",
          protocol: local ? (local.protocol || "unknown") : "unknown",
          family: addressFamily(local ? local.address : null),
        },
        remote: {
          type: remote ? (remote.candidateType || "unknown") : "unknown",
          protocol: remote ? (remote.protocol || "unknown") : "unknown",
          family: addressFamily(remote ? remote.address : null),
        },
        requestsSent: pair.requestsSent || 0,
        responsesReceived: pair.responsesReceived || 0,
      };
    });

    return JSON.stringify({
      iceConnectionState: pc.iceConnectionState,
      connectionState: pc.connectionState,
      remoteCandidateTypes: Array.from(remoteTypeSet),
      pairs: pairs,
    });
  } catch (err) {
    return JSON.stringify({ error: String(err && err.message ? err.message : err) });
  }
};

// Diagnostics only (bead gateopener-672.27): once `pc.connectionState` first
// reaches "connected" (see the onconnectionstatechange handler in
// negotiate() above), polls pc.getStats() every ~2s for the transport's
// selectedCandidatePairId and logs the local/remote candidate types,
// address families, transport state, and bytesReceived for that pair. Never
// logs an address itself. `window.__diagPairTimer` holds the interval
// handle so closeSession() below can stop it; harmless (a no-op re-poll on
// an already-closed pc) if it ever fires after teardown, since getStats()
// on a closed RTCPeerConnection simply resolves with the last-known report
// set or rejects, both handled here.
window.__diagPairTimer = null;
function startSelectedPairPolling(pc) {
  if (window.__diagPairTimer) return;
  window.__diagPairTimer = setInterval(async () => {
    try {
      const stats = await pc.getStats();
      let transport = null;
      stats.forEach((report) => {
        if (report.type === 'transport') transport = report;
      });
      if (!transport || !transport.selectedCandidatePairId) return;
      const pair = stats.get(transport.selectedCandidatePairId);
      if (!pair) return;
      const local = stats.get(pair.localCandidateId);
      const remote = stats.get(pair.remoteCandidateId);
      diag("selected pair: local(type=" + (local ? local.candidateType : "?") + " family=" + addressFamily(local ? local.address : null) +
        ") remote(type=" + (remote ? remote.candidateType : "?") + " family=" + addressFamily(remote ? remote.address : null) +
        ") state=" + pair.state + " bytesReceived=" + (pair.bytesReceived || 0));
    } catch (err) {
      // Best-effort diagnostics only; never let a polling failure surface.
    }
  }, 2000);
}
function stopSelectedPairPolling() {
  if (window.__diagPairTimer) {
    clearInterval(window.__diagPairTimer);
    window.__diagPairTimer = null;
  }
}

// Re-issues video.play() if the element is currently paused (bead
// gateopener-672.30): iOS pauses/refuses inline media playback on a hidden
// (opacity-0) WKWebView, and DoorVideoView now keeps the web view visible
// at all times specifically so play() can succeed here instead of leaving
// the element paused with a native "tap to play" glyph. No-op (returns
// "no-video") if the video element is missing -- guards this addition so a
// page variant without a #v element (there is none today, but future-proof
// per this bead's brief) never throws. Returns a short status string Swift
// records into diagnostics; never throws.
window.ensurePlaying = async function () {
  const video = document.getElementById("v");
  if (!video) return "no-video";
  if (!video.paused) return "playing";
  try {
    await video.play();
    return "resumed";
  } catch (e) {
    diag("play() rejected: " + (e && e.name) + " " + (e && e.message));
    return "rejected:" + (e && e.name);
  }
};

// Set by Swift (via callAsyncJavaScript) immediately before it calls
// window.closeSession(), so the video-element "pause" listener below can
// tell a teardown-triggered pause (expected, must NOT retry play()) apart
// from an unexpected mid-session pause (must retry). closeSession() itself
// stays byte-identical to its pre-gateopener-672.30 form -- this flag is
// set from a SEPARATE function Swift calls first, rather than added inside
// closeSession, specifically so closeSession's body never changes.
window.markClosing = function () {
  window.__state.closing = true;
};

// Video-element playback event listeners (bead gateopener-672.30): every
// event just diag()s its name plus paused/readyState for visibility into
// why iOS may have paused playback. On "pause", if the peer connection is
// still "connected" and the session is not closing (see markClosing above),
// this is an UNEXPECTED pause (not the deliberate teardown blanking in
// closeSession), so play() is retried once after 250ms and the outcome is
// diag()'d. Guarded on the #v element existing so this whole block is a
// no-op on any page variant without one.
(function () {
  const video = document.getElementById("v");
  if (!video) return;
  const events = ["play", "playing", "pause", "stalled", "suspend", "waiting", "ended"];
  events.forEach((name) => {
    video.addEventListener(name, () => {
      diag("video event: " + name + " paused=" + video.paused + " readyState=" + video.readyState);
      if (name === "pause") {
        const pc = window.__state.pc;
        if (pc && pc.connectionState === "connected" && !window.__state.closing) {
          setTimeout(() => {
            video.play().then(
              () => diag("retry play() after unexpected pause: resumed"),
              (e) => diag("retry play() after unexpected pause: rejected " + (e && e.name) + " " + (e && e.message))
            );
          }, 250);
        }
      }
    });
  });
})();

// Tears down the RTCPeerConnection. Idempotent: safe to call even if no
// session was ever started, or if called more than once.
window.closeSession = function () {
  stopSelectedPairPolling();
  if (window.__state.cancelGathering) {
    window.__state.cancelGathering();
  }
  const pc = window.__state.pc;
  if (pc) {
    try {
      pc.close();
    } catch (err) {
      logMsg("error closing RTCPeerConnection: " + err);
    }
  }
  window.__state.pc = null;
  const video = document.getElementById("v");
  video.srcObject = null;
  return true;
};
</script>
</body>
